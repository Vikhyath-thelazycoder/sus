schema_version: 1
decisions:
- decision_id: D-001
  date: '2026-11-05'
  kind: architecture
  topic: Hosting
  decision: Demo on Cloudflare Workers Free; production on Cloudflare Workers Paid only
  reason: 'All needed services in one free account; owner rule: production stays on Cloudflare'
  alternatives:
  - Render, Vercel
  impact: Free-plan limits (3 MB, 10 ms) checked in T-1.7; demo-only fallback decided then
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-002
  date: '2026-11-05'
  kind: architecture
  topic: Database
  decision: D1 (SQLite+FTS5) + Vectorize
  reason: All-Cloudflare, cheapest (~$10-15/mo est. at 100k chunks), never pauses
  alternatives:
  - Supabase Postgres+pgvector (~$30-60/mo, pauses on free, built-in auth)
  impact: 'Two stores to keep in sync: orphan-vector cleanup cron; 10 GB per-DB cap'
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-003
  date: '2026-11-05'
  kind: architecture
  topic: Orchestration
  decision: Hono + LangGraph.js with own retrieval code; no full LangChain
  reason: Owner wants LangGraph; nodes as plain functions keep it removable; security-critical retrieval is custom anyway
  alternatives:
  - Hono + plain functions; Hono + LangChain
  impact: Bundle and CPU measured in T-1.7
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-004
  date: '2026-11-05'
  kind: architecture
  topic: LLM provider
  decision: Groq (Llama 3.3 70B) for the demo via the OpenAI SDK; OpenAI in the MVP
  reason: No OpenAI key yet; Groq is free and OpenAI-compatible
  alternatives:
  - Gemini free, Workers AI, OpenRouter
  impact: ~25-30 full answers/day on the 70B free tier; fallback chain
  supersedes: null
  status: SUPERSEDED
  tags: []
- decision_id: D-005
  date: '2026-11-05'
  kind: architecture
  topic: Caching and counters
  decision: Workers KV for the answer cache; Rate Limiting binding / Durable Objects for counters; no Redis on Cloudflare
  reason: Built in and included; KV is eventually consistent so not used for counters
  alternatives:
  - Upstash Redis (only if the demo moves to Render)
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-006
  date: '2026-11-05'
  kind: architecture
  topic: PDF parsing
  decision: pdf.js first; optional Python parser (Docling/GROBID) only if T-2.5 shows bad tables
  reason: Free and runs in browser and Node; Python can't run in Workers
  alternatives:
  - Workers AI toMarkdown, Docling, GROBID
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-007
  date: '2026-11-05'
  kind: architecture
  topic: Big PDFs
  decision: 'Demo: browser-side parsing (5 x 100 pages). Production: server-side via Cloudflare Queues'
  reason: Avoids the free 10 ms CPU limit; Queues need the paid plan
  alternatives: []
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-008
  date: '2026-11-05'
  kind: security
  topic: Identity in demo
  decision: No login; server-issued HMAC-signed anonymous cookie; owner_id on every query; uploads private to the uploader
  reason: Frictionless client demo without cross-user leaks
  alternatives:
  - Email or Google login (moved to the MVP)
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-009
  date: '2026-11-05'
  kind: design
  topic: Visual direction
  decision: 'Calm minimal: warm off-white + sage green, dark mode toggle, desktop-first, citation side panel / mobile bottom
    sheet'
  reason: Owner choice; long technical answers need low visual noise
  alternatives:
  - Dark-first; pure white
  impact: ''
  supersedes: null
  status: ACTIVE
  tags: []
- decision_id: D-010
  date: '2026-11-05'
  kind: architecture
  topic: Orchestration
  decision: 'Demo: Hono + plain-function pipeline with own retrieval code; LangGraph returns in the MVP on Workers Paid'
  reason: 'T-1.7: LangGraph fit on size (502 KiB gzip) but used p50 14 ms / p90 82 ms CPU vs the free 10 ms limit; owner chose
    option B'
  alternatives:
  - Workers Paid now (A); Render demo (C)
  impact: Bundle 21 KiB gzip; same steps; agents need LangGraph later
  supersedes: D-003
  status: ACTIVE
  tags: []
- decision_id: D-011
  date: '2026-11-05'
  kind: architecture
  topic: LLM provider
  decision: Groq openai/gpt-oss-120b -> qwen/qwen3.8-27b -> openai/gpt-oss-20b (small model gpt-oss-20b) for the demo; OpenAI
    in the MVP
  reason: 'P1 check: Groq retired llama-3.3-70b-versatile and llama-3.1-8b-instant (404); the three listed models return 200
    with 1,000 req/day and 8,000 tokens/min each'
  alternatives: []
  impact: ''
  supersedes: D-004
  status: SUPERSEDED
  tags: []
- decision_id: D-012
  date: '2026-11-05'
  kind: architecture
  topic: Demo hosting
  decision: Demo runs on Render free (Singapore) with the same Hono app on Node; data stays on Cloudflare (production D1,
    Vectorize, Workers AI, KV) via the REST API. Production stays on Cloudflare Workers Paid.
  reason: 'Owner rule (PROJECT_PLAN: demo moves to Render if it doesn''t fit the Workers free plan). Ingestion measured 10-30
    ms CPU per request vs the 10 ms limit; Render has no per-request CPU cap.'
  alternatives:
  - Workers Paid now; local-only ingestion via REST; Render Postgres (expires after 30 days)
  impact: Free web service sleeps after 15 min idle (30-60 s cold start); one REST adapter (src/server/cloudflare-rest.ts)
  supersedes: D-001
  status: ACTIVE
  tags: []
- decision_id: D-013
  date: '2026-11-06'
  kind: architecture
  topic: Answer model chain
  decision: Answers use openai/gpt-oss-120b -> qwen/qwen3.8-27b only; openai/gpt-oss-20b stays the small model for guard and
    rewrite
  reason: 'T-4.8: all 4 unfaithful answers came from gpt-oss-20b (4 of its 12); with the 2-model chain the same 12 questions
    were 12/12 faithful. Cost: lower burst capacity (~3-4 answers/min on Groq free)'
  alternatives:
  - Keep gpt-oss-20b as last resort with a visible label
  impact: ''
  supersedes: D-011
  status: ACTIVE
  tags: []
