    title: '**Model choice: cheapest model that meets the quality bar** (owner, 2026-11-06). Run the 60 questions on low-cost
      cloud models (e.g. Gemini Flash-class, GPT mini-class, Groq-hosted gpt-oss-120b from the demo) and on **self-hosted
      Qwen as the backup**. Measure faithfulness, citation validity, decline accuracy, latency and **cost per answer and per
      month at 5, 25 and 100 users**. Also cost levers: small model for rewrite/guard, answer cache, prompt caching, short
      context from reranking, cheap embeddings'
    status: PLANNED
  - id: T-9.12
    title: 'Hosting, storage, backup and cost. **Decided (D-021): Cloudflare Workers Paid + own domain + R2 + Queues from
      the start**; a VM only if an audited tool (RAGFlow/Infinity) cannot run on Cloudflare and the owner approves it. Monthly
      cost at 5, 25 and 100 users and at 10, 50 and 200 GB stored (no upper limit, D-028); the client quote follows from this'
    status: PLANNED
  - id: T-9.14
    title: '**Capacity and overload design** (owner: the server must never overload; no repeat of the Supabase overload seen
